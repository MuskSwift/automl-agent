[project]
name = "automl-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jachey wang", email = "ghostching@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.104",
    "openml>=0.15.1",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "scikit-learn>=1.9.1",
    "smolagents[docker,litellm,mcp,openai]==1.26.0",
]

[project.scripts]
automl-agent = "automl_agent:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
local-ml = [
    "lightgbm>=4.7.0",
    "optuna>=5.0.0",
    "pytest>=9.1.1",
    "xgboost>=3.4.1",
]
